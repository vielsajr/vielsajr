<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Formulario de alta</h1>
    <form action="https://api.web3forms.com/submit" method="POST" id="formulario" autocomplete="off">
                <div class="linea_formulario">
                    <label for="name">Nombre</label>
                    <div class="contenido"><input type="text" name="name" list="nombres" required autofocus><span class="obligatorio">*</span>
                        <datalist id="nombres">
                            <option value="Guillermo"></option>
                            <option value="Pelayo"></option>
                            <option value="Alfredo"></option>
                            <option value="Adrián"></option>
                            <option value="Saúl"></option>
                            <option value="Fabricio"></option>
                            <option value="Álvaro"></option>
                            <option value="Rodrigo"></option>
                            <option value="Sergio"></option>
                            <option value="Izan"></option>
                        </datalist>
                    </div>
                </div>
                <div class="linea_formulario">
                    <label for="surname">Apellidos</label>
                    <div class="contenido"><input type="text" name="surname" required><span class="obligatorio">*</span></div>
                </div>
                <div class="linea_formulario">
                    <label for="birthday">Fecha de nacimiento</label>
                    <div class="contenido"><input type="date" name="birthday"></div>
                </div>
                <div class="linea_formulario">
                    <label for="dni">DNI</label>
                    <div class="contenido"><input type="text" name="dni" pattern="\d{8}[A-Z]$"></div>
                </div>
                <div class="linea_formulario">
                    <label for="mail">Email</label>
                    <div class="contenido"><input type="email" name="mail" required><span class="obligatorio">*</span></div>
                </div>
                <div class="linea_formulario">
                    <label for="password">Contraseña</label>
                    <div class="contenido"><input type="password" name="password" required><span class="obligatorio">*</span></div>
                </div>
                <div class="linea_formulario">
                    <label for="repeated password">Contraseña (Repetición)</label>
                    <div class="contenido"><input type="password" name="repeated password" required><span class="obligatorio">*</span></div>
                </div>
                <div class="linea_formulario">
                    <label for="website">Página Web</label>
                    <div class="contenido"><input type="url" name="website" placeholder="http://www.mipagina.com"></div>
                </div>
                <div class="linea_formulario">
                    <label for="age">Edad</label>
                    <div class="contenido"><input type="number" name="age" min="10" max="100" step="5"></div>
                </div>
                <div class="linea_formulario">
                    <label for="gender">Género</label>
                    <div id="genero" class="contenido">
                        <div><input type="radio" name="gender" value="masculino">Masculino</div>
                        <div><input type="radio" name="gender" value="femenino">Femenino</div>
                        <div><input type="radio" name="gender" value="no-binario">No binario</div>
                        <div><input type="radio" name="gender" value="prefiero-no-decirlo">Prefiero no decirlo</div>
                    </div>
                </div>
                <div class="linea_formulario">
                    <label for="news"></label>
                    <div class="contenido"><input type="checkbox" name="news" value="suscribirse"><label for="">Suscribirme al boletín de novedades</label></div>
                </div>
                <div class="linea_formulario">
                    <label for="fav-product">Producto Favorito</label>
                    <div class="contenido">
                        <select name="fav-product" id="">
                            <option value=""selected disabled>Elige uno...</option>
                            <option value="Tarjeta gráfica">Tarjeta gráfica</option>
                            <option value="Memoria RAM">Memoria RAM</option>
                            <option value="Placa base">Placa base</option>
                            <option value="Procesador">Procesador</option>
                            <option value="Fuente de alimentación">Fuente de alimentación</option>
                        </select>
                    </div>
                </div>
                <div class="linea_formulario">
                    <label for="commets">Comentario</label>
                    <div class="contenido"><textarea name="comment" placeholder="Introduce tu comentario..."></textarea></div>
                </div>
                <button><input type="submit" name="enviar datos" value="Enviar Datos"></button>
                <input type="hidden" name="access_key" value="0c4aa944-233f-4221-9fcc-dfaa6065e83f"> <!-- no funciona al enviar el formulario -->
            </form>
</body>
</html>
