<th:block th:fragment="layout (titulo, contenido)"><!DOCTYPE html>
    <html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo}">Club Deportivo</title>
        <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/estilo.css}" rel="stylesheet">
    </head>
    <body>
    <th:block th:replace="~{layouts/navbar :: navbar-principal}"></th:block>
    <main class="container">
        <th:block th:replace="${contenido}"></th:block>
    </main>
    <script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </body>
    </html>
</th:block>
