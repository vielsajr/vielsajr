spring.application.name=examen1
server.port=8000
# Muestra los cambios en plantillas sin reiniciar
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.mvc.format.date=iso
# Convierte los POST con el campo oculto _method=delete en DELETE
spring.mvc.hiddenmethod.filter.enabled=true

# Limite de tamano de los archivos subidos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Carpeta donde se guardan las imagenes (fuera del JAR, relativa al proyecto)
actividades.ruta.imagenes=uploads/imagenes

# Ademas de static/, sirve los ficheros de uploads/: uploads/imagenes/x.jpg -> /imagenes/x.jpg
spring.web.resources.static-locations=classpath:/static/,file:uploads/

file.upload-dir=src/main/resources/static/img/imagenes
